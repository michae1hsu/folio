name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Scan source and all Git history
        run: |
          python scripts/install_gitleaks.py
          python scripts/check_secrets.py --worktree
          python scripts/check_secrets.py --history
          python scripts/run_gitleaks.py --history
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.0"
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          npm ci
      - name: Run synthetic offline tests
        run: python -m unittest discover -s tests -v
      - name: Build frontend
        run: npm run build
